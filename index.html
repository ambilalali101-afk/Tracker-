<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tracker">
<title>Expense Tracker</title>
<style>
:root {
  --bg:#ffffff;--bg2:#f6f6f4;--bg3:#ededea;
  --text:#1a1a18;--text2:#6b6b66;--text3:#a0a09a;
  --border:rgba(0,0,0,0.10);--border2:rgba(0,0,0,0.18);
  --green:#1a9e6e;--green-bg:#e0f5ec;--green-dk:#0a5038;
  --red:#d85528;--red-bg:#faeae5;--red-dk:#8f3010;
  --blue:#2563eb;--blue-bg:#eff4ff;--blue-dk:#1a3fa0;
  --yellow:#d97706;--yellow-bg:#fef3c7;
  --radius:10px;--radius-lg:14px;--radius-xl:18px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1b1b19;--bg2:#252523;--bg3:#2f2f2c;
  --text:#f0efe9;--text2:#9a9a92;--text3:#6a6a64;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.16);
  --green:#1fc97e;--green-bg:#07301f;--green-dk:#5dcaa5;
  --red:#e87050;--red-bg:#2e0f04;--red-dk:#f09978;
  --blue:#5b8ef5;--blue-bg:#0d1a3a;--blue-dk:#93b4fd;
  --yellow:#fbbf24;--yellow-bg:#2a1c02;
}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px}

/* NAV BAR */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:0.5px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 4px 8px;border:none;background:transparent;color:var(--text3);font-size:10px;font-weight:500;cursor:pointer;gap:3px;transition:color .15s}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-btn.active{color:var(--blue)}
.nav-btn.active svg{stroke:var(--blue)}

/* HEADER */
.hdr{position:sticky;top:0;background:var(--bg);border-bottom:0.5px solid var(--border);z-index:20;padding:14px 16px 12px}
.hdr-row{display:flex;align-items:center;justify-content:space-between}
.page-title{font-size:20px;font-weight:800;letter-spacing:-.3px}
.month-nav{display:flex;align-items:center;gap:8px}
.mnav-btn{background:var(--bg2);border:0.5px solid var(--border);border-radius:8px;padding:5px 12px;font-size:16px;color:var(--text2);cursor:pointer;line-height:1}
.month-lbl{font-size:14px;font-weight:600;min-width:100px;text-align:center}

/* PAGES */
.page{display:none;padding:16px}
.page.active{display:block}

/* SUMMARY STRIP */
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.scard{background:var(--bg2);border-radius:var(--radius);padding:11px 12px;border:0.5px solid var(--border)}
.slbl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.sval{font-size:18px;font-weight:800}
.sval.g{color:var(--green)}.sval.r{color:var(--red)}
.pbar{height:4px;background:var(--bg3);border-radius:2px;margin-top:6px;overflow:hidden}
.pfill{height:100%;border-radius:2px;transition:width .4s}

/* QUICK ADD */
.qadd{background:var(--bg2);border-radius:var(--radius-xl);border:0.5px solid var(--border);padding:14px;margin-bottom:20px}
.qadd-title{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.type-toggle{display:flex;background:var(--bg3);border-radius:var(--radius);padding:3px;margin-bottom:12px;gap:3px}
.tt-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;background:transparent;color:var(--text2);transition:all .2s}
.tt-btn.exp.on{background:var(--red-bg);color:var(--red-dk)}
.tt-btn.inc.on{background:var(--green-bg);color:var(--green-dk)}
.tt-btn.sav.on{background:var(--blue-bg);color:var(--blue-dk)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:11px;font-weight:600;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.03em}
.field input,.field select{width:100%;padding:11px 12px;border:0.5px solid var(--border2);border-radius:var(--radius);background:var(--bg);color:var(--text);font-size:15px;font-family:inherit;outline:none;-webkit-appearance:none;margin-bottom:10px}
.field input:focus,.field select:focus{border-color:var(--blue)}
.add-btn{width:100%;padding:14px;border:none;border-radius:var(--radius);font-size:16px;font-weight:800;cursor:pointer;transition:opacity .15s;color:#fff;background:var(--blue);margin-top:2px}
.add-btn:active{opacity:.75}

/* QUICK CATS */
.qcats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.qcat{padding:6px 12px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg3);font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;white-space:nowrap}
.qcat.active{background:var(--blue-bg);color:var(--blue-dk);border-color:var(--blue)}

/* SECTION HEADERS */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:4px}
.sec-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em}
.sec-link{font-size:13px;color:var(--blue);font-weight:600;cursor:pointer;border:none;background:transparent;padding:0}

/* WEEK TABS */
.week-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;margin-bottom:16px}
.week-tabs::-webkit-scrollbar{display:none}
.wtab{flex-shrink:0;padding:7px 14px;border-radius:var(--radius);border:0.5px solid var(--border);background:transparent;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;white-space:nowrap;transition:all .15s}
.wtab span{display:block;font-size:10px;color:var(--text3);font-weight:400;margin-top:2px}
.wtab.cur{border-color:var(--green);color:var(--green-dk)}
.wtab.sel{background:var(--bg2);color:var(--text);border-color:var(--border2)}
.wtab.cur.sel{background:var(--green-bg);border-color:var(--green)}

/* WEEK MINI STRIP */
.wstrip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.wcard{background:var(--bg2);border-radius:var(--radius);padding:8px 10px;border:0.5px solid var(--border)}
.wlbl{font-size:9px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.wval{font-size:15px;font-weight:800}
.wval.g{color:var(--green)}.wval.r{color:var(--red)}

/* TX LIST */
.tx-list{display:flex;flex-direction:column;gap:6px}
.tx-wrap{position:relative;overflow:hidden;border-radius:var(--radius-lg)}
.tx-del-bg{position:absolute;right:0;top:0;bottom:0;width:70px;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;border-radius:var(--radius-lg)}
.tx{display:flex;align-items:center;gap:11px;padding:12px 13px;background:var(--bg);border:0.5px solid var(--border);border-radius:var(--radius-lg);position:relative;z-index:1;transition:transform .2s;cursor:default}
.tx-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0}
.tx-info{flex:1;min-width:0}
.tx-desc{font-size:14px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-meta{font-size:11px;color:var(--text3);margin-top:2px}
.tx-amt{font-size:15px;font-weight:800;flex-shrink:0}
.tx-amt.g{color:var(--green)}.tx-amt.r{color:var(--red)}.tx-amt.b{color:var(--blue)}
.del-btn{background:transparent;border:none;color:var(--text3);font-size:22px;cursor:pointer;padding:0 2px;line-height:1;flex-shrink:0}
.del-btn:active{color:var(--red)}

/* BREAKDOWN BARS */
.cat-sec{margin-top:16px}
.cat-title-row{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.catrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.catrow-icon{font-size:15px;width:20px;text-align:center;flex-shrink:0}
.catrow-name{font-size:12px;font-weight:600;color:var(--text2);width:70px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catrow-bar{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.catrow-fill{height:100%;border-radius:3px;background:var(--red)}
.catrow-amt{font-size:12px;font-weight:700;color:var(--text);min-width:55px;text-align:right}
.catrow-pct{font-size:11px;color:var(--text3);min-width:30px;text-align:right}

/* SAVINGS GOALS */
.goals-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.goal-card{background:var(--bg2);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:13px 14px}
.goal-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.goal-name{font-size:14px;font-weight:700}
.goal-amts{font-size:12px;color:var(--text2)}
.goal-bar{height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:6px}
.goal-fill{height:100%;border-radius:4px;background:var(--blue);transition:width .4s}
.goal-fill.done{background:var(--green)}
.goal-bottom{display:flex;align-items:center;justify-content:space-between}
.goal-pct{font-size:12px;font-weight:700;color:var(--blue)}
.goal-pct.done{color:var(--green)}
.goal-eta{font-size:11px;color:var(--text3)}
.goal-add-btn{padding:5px 12px;border-radius:20px;border:0.5px solid var(--blue);background:var(--blue-bg);color:var(--blue-dk);font-size:12px;font-weight:600;cursor:pointer}
.goal-add-btn:active{opacity:.7}
.new-goal-btn{width:100%;padding:12px;border:0.5px dashed var(--border2);border-radius:var(--radius-lg);background:transparent;color:var(--text3);font-size:14px;font-weight:600;cursor:pointer;margin-bottom:20px}
.new-goal-btn:active{background:var(--bg2)}

/* ANALYTICS */
.chart-card{background:var(--bg2);border-radius:var(--radius-lg);border:0.5px solid var(--border);padding:14px;margin-bottom:16px}
.chart-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:12px}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:100px;padding-bottom:24px;position:relative}
.bc-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.bc-bar-wrap{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end}
.bc-bar{width:100%;border-radius:4px 4px 0 0;min-height:2px;transition:height .4s}
.bc-bar.inc{background:var(--green)}
.bc-bar.exp{background:var(--red)}
.bc-lbl{font-size:9px;color:var(--text3);text-align:center;font-weight:600}
.chart-legend{display:flex;gap:16px;margin-top:8px}
.leg-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.leg-dot{width:8px;height:8px;border-radius:50%}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal-bg.show{opacity:1;pointer-events:all}
.modal{background:var(--bg);border-radius:var(--radius-xl) var(--radius-xl) 0 0;padding:20px 20px 40px;width:100%;max-width:500px;transform:translateY(100%);transition:transform .3s}
.modal-bg.show .modal{transform:translateY(0)}
.modal-title{font-size:17px;font-weight:800;margin-bottom:16px}
.modal-close{float:right;background:var(--bg2);border:none;border-radius:8px;padding:4px 10px;font-size:18px;cursor:pointer;color:var(--text2)}

.empty{text-align:center;padding:28px 0;color:var(--text3);font-size:14px}
.badge{font-size:10px;padding:2px 7px;border-radius:12px;font-weight:600}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-row">
    <span class="page-title" id="page-title">Overview</span>
    <div class="month-nav">
      <button class="mnav-btn" onclick="shiftMonth(-1)">‹</button>
      <span class="month-lbl" id="month-lbl"></span>
      <button class="mnav-btn" onclick="shiftMonth(1)">›</button>
    </div>
  </div>
</div>

<!-- PAGES -->
<div id="pg-overview" class="page active">
  <!-- Summary strip -->
  <div class="strip">
    <div class="scard"><div class="slbl">Earned</div><div class="sval g" id="ov-inc">$0</div></div>
    <div class="scard"><div class="slbl">Spent</div><div class="sval r" id="ov-exp">$0</div></div>
    <div class="scard"><div class="slbl">Saved</div><div class="sval" id="ov-bal">$0</div><div class="pbar"><div class="pfill" id="ov-bar" style="width:0%"></div></div></div>
  </div>

  <!-- Quick add -->
  <div class="qadd">
    <div class="qadd-title">Quick Add</div>
    <div class="type-toggle">
      <button class="tt-btn exp on" id="tt-exp" onclick="setType('expense')">Expense</button>
      <button class="tt-btn inc" id="tt-inc" onclick="setType('income')">Income</button>
      <button class="tt-btn sav" id="tt-sav" onclick="setType('saving')">Saving</button>
    </div>
    <div class="qcats" id="qcats"></div>
    <div class="grid2">
      <div class="field"><label>Description</label><input id="f-desc" type="text" placeholder="What for?" autocomplete="off"></div>
      <div class="field"><label>Amount ($)</label><input id="f-amt" type="number" placeholder="0.00" min="0" step="0.01" inputmode="decimal"></div>
    </div>
    <div class="grid2">
      <div class="field"><label>Date</label><input id="f-date" type="date"></div>
      <div class="field"><label>Note (optional)</label><input id="f-note" type="text" placeholder="Optional note"></div>
    </div>
    <button class="add-btn" id="add-btn" onclick="addTx()">+ Add Transaction</button>
  </div>

  <!-- Recent transactions -->
  <div class="sec-hdr">
    <span class="sec-title">This Month</span>
    <button class="sec-link" onclick="goPage('transactions')">See all →</button>
  </div>
  <div id="ov-txlist" class="tx-list"></div>
</div>

<div id="pg-transactions" class="page">
  <div class="week-tabs" id="week-tabs"></div>
  <div class="wstrip">
    <div class="wcard"><div class="wlbl">Earned</div><div class="wval g" id="wk-inc">$0</div></div>
    <div class="wcard"><div class="wlbl">Spent</div><div class="wval r" id="wk-exp">$0</div></div>
    <div class="wcard"><div class="wlbl">Net</div><div class="wval" id="wk-bal">$0</div></div>
  </div>
  <div id="wk-txlist" class="tx-list"></div>
  <div id="wk-cats" class="cat-sec"></div>
</div>

<div id="pg-analytics" class="page">
  <div class="chart-card">
    <div class="chart-title">6-Month Overview</div>
    <div class="bar-chart" id="bar-chart"></div>
    <div class="chart-legend">
      <div class="leg-item"><div class="leg-dot" style="background:var(--green)"></div>Income</div>
      <div class="leg-item"><div class="leg-dot" style="background:var(--red)"></div>Expenses</div>
    </div>
  </div>
  <div class="chart-card">
    <div class="chart-title">Top Spending Categories</div>
    <div id="an-cats"></div>
  </div>
</div>

<div id="pg-goals" class="page">
  <div class="goals-grid" id="goals-list"></div>
  <button class="new-goal-btn" onclick="showNewGoalModal()">＋ New Savings Goal</button>
</div>

<!-- BOTTOM NAV -->
<nav class="nav">
  <button class="nav-btn active" id="nav-overview" onclick="goPage('overview')">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Overview
  </button>
  <button class="nav-btn" id="nav-transactions" onclick="goPage('transactions')">
    <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    Transactions
  </button>
  <button class="nav-btn" id="nav-analytics" onclick="goPage('analytics')">
    <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
    Analytics
  </button>
  <button class="nav-btn" id="nav-goals" onclick="goPage('goals')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>
    Goals
  </button>
</nav>

<!-- NEW GOAL MODAL -->
<div class="modal-bg" id="modal-goal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-goal')">×</button>
    <div class="modal-title">New Savings Goal</div>
    <div class="field"><label>Goal Name</label><input id="g-name" type="text" placeholder="e.g. Emergency Fund"></div>
    <div class="grid2">
      <div class="field"><label>Target ($)</label><input id="g-target" type="number" placeholder="1000" min="1" step="1" inputmode="decimal"></div>
      <div class="field"><label>Already Saved ($)</label><input id="g-saved" type="number" placeholder="0" min="0" step="0.01" inputmode="decimal"></div>
    </div>
    <div class="field"><label>Emoji Icon</label><input id="g-icon" type="text" placeholder="🎯" maxlength="2"></div>
    <button class="add-btn" onclick="addGoal()">Create Goal</button>
  </div>
</div>

<!-- ADD TO GOAL MODAL -->
<div class="modal-bg" id="modal-goal-add">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('modal-goal-add')">×</button>
    <div class="modal-title" id="modal-goal-add-title">Add to Goal</div>
    <div class="field"><label>Amount ($)</label><input id="ga-amt" type="number" placeholder="0.00" min="0" step="0.01" inputmode="decimal"></div>
    <button class="add-btn" onclick="addToGoal()">Add Savings</button>
  </div>
</div>

<script>
const CAT_MAP = {
  expense: [
    {name:'Food',icon:'🍔'},{name:'Transport',icon:'🚗'},{name:'Groceries',icon:'🛒'},
    {name:'Rent',icon:'🏠'},{name:'Bills',icon:'💡'},{name:'Study',icon:'📚'},
    {name:'Health',icon:'💊'},{name:'Entertainment',icon:'🎮'},{name:'Crypto',icon:'💰'},
    {name:'Clothing',icon:'👕'},{name:'Other',icon:'📦'}
  ],
  income: [
    {name:'Wages',icon:'💵'},{name:'Tips',icon:'🤝'},{name:'Investment',icon:'📈'},
    {name:'Freelance',icon:'💻'},{name:'Other',icon:'💸'}
  ],
  saving: [
    {name:'Emergency',icon:'🛡️'},{name:'Holiday',icon:'✈️'},{name:'Tech',icon:'💻'},
    {name:'Education',icon:'🎓'},{name:'General',icon:'🏦'}
  ]
};

let txType = 'expense';
let selCat = CAT_MAP.expense[0].name;
let monthOffset = 0;
let selWeekIdx = -1;
let goalAddId = null;

const DB = {
  load(k,def){ try{ return JSON.parse(localStorage.getItem(k)||'null')||def }catch(e){return def} },
  save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){} }
};

function txs(){ return DB.load('etx2',[]) }
function saveTxs(d){ DB.save('etx2',d) }
function goals(){ return DB.load('egoals2',[]) }
function saveGoals(d){ DB.save('egoals2',d) }

function fmt(n){ return '$'+Math.abs(n).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2}) }
function dk(d){ return d.toISOString().slice(0,10) }
function curMonthYear(){ const d=new Date(); d.setMonth(d.getMonth()+monthOffset); return {y:d.getFullYear(),m:d.getMonth()} }

function getMonthWeeks(y,m){
  const weeks=[]; const first=new Date(y,m,1);
  const fm=new Date(first); const dow=first.getDay();
  fm.setDate(first.getDate()+(dow===0?-6:1-dow));
  let s=new Date(fm),n=1;
  for(let i=0;i<7;i++){
    const e=new Date(s); e.setDate(s.getDate()+6);
    if(s.getMonth()>m&&s.getFullYear()>=y) break;
    if(!(e.getMonth()<m&&e.getFullYear()<=y)) weeks.push({num:n,start:new Date(s),end:new Date(e)});
    s.setDate(s.getDate()+7); n++;
  }
  return weeks;
}

function isThisWeek(s,e){ const t=new Date(); return t>=s&&t<=e }

function setType(t){
  txType=t; selCat=CAT_MAP[t][0].name;
  ['exp','inc','sav'].forEach(x=>document.getElementById('tt-'+x).className='tt-btn '+x+(t==={exp:'expense',inc:'income',sav:'saving'}[x]?' on':''));
  renderQcats();
  const btn=document.getElementById('add-btn');
  btn.style.background=t==='expense'?'var(--red)':t==='income'?'var(--green)':'var(--blue)';
}

function renderQcats(){
  const el=document.getElementById('qcats');
  el.innerHTML=CAT_MAP[txType].map(c=>`<button class="qcat${c.name===selCat?' active':''}" onclick="selCatFn('${c.name}')">${c.icon} ${c.name}</button>`).join('');
}
function selCatFn(c){ selCat=c; renderQcats() }

function addTx(){
  const desc=document.getElementById('f-desc').value.trim();
  const amt=parseFloat(document.getElementById('f-amt').value);
  const date=document.getElementById('f-date').value||dk(new Date());
  const note=document.getElementById('f-note').value.trim();
  if(!desc||isNaN(amt)||amt<=0){alert('Enter description and amount.');return}
  const cat=CAT_MAP[txType].find(c=>c.name===selCat)||CAT_MAP[txType][0];
  const all=txs();
  all.push({id:Date.now(),type:txType,desc,amount:amt,cat:cat.name,icon:cat.icon,date,note});
  saveTxs(all);
  document.getElementById('f-desc').value='';
  document.getElementById('f-amt').value='';
  document.getElementById('f-note').value='';
  render();
}

function deleteTx(id){
  if(!confirm('Delete this transaction?'))return;
  saveTxs(txs().filter(t=>t.id!==id));
  render();
}

function shiftMonth(d){ monthOffset+=d; selWeekIdx=-1; render() }

let curPage='overview';
function goPage(p){
  curPage=p;
  document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('pg-'+p).classList.add('active');
  document.getElementById('nav-'+p).classList.add('active');
  const titles={overview:'Overview',transactions:'Transactions',analytics:'Analytics',goals:'Goals'};
  document.getElementById('page-title').textContent=titles[p];
  render();
}

function showNewGoalModal(){ document.getElementById('modal-goal').classList.add('show') }
function closeModal(id){ document.getElementById(id).classList.remove('show') }
document.getElementById('modal-goal').addEventListener('click',e=>{ if(e.target===document.getElementById('modal-goal'))closeModal('modal-goal') });
document.getElementById('modal-goal-add').addEventListener('click',e=>{ if(e.target===document.getElementById('modal-goal-add'))closeModal('modal-goal-add') });

function addGoal(){
  const name=document.getElementById('g-name').value.trim();
  const target=parseFloat(document.getElementById('g-target').value);
  const saved=parseFloat(document.getElementById('g-saved').value)||0;
  const icon=document.getElementById('g-icon').value.trim()||'🎯';
  if(!name||isNaN(target)||target<=0){alert('Enter a name and target.');return}
  const all=goals();
  all.push({id:Date.now(),name,target,saved,icon});
  saveGoals(all);
  document.getElementById('g-name').value='';
  document.getElementById('g-target').value='';
  document.getElementById('g-saved').value='';
  document.getElementById('g-icon').value='';
  closeModal('modal-goal');
  render();
}

function openAddToGoal(id){
  goalAddId=id;
  const g=goals().find(x=>x.id===id);
  document.getElementById('modal-goal-add-title').textContent='Add to: '+g.name;
  document.getElementById('ga-amt').value='';
  document.getElementById('modal-goal-add').classList.add('show');
}

function addToGoal(){
  const amt=parseFloat(document.getElementById('ga-amt').value);
  if(isNaN(amt)||amt<=0){alert('Enter a valid amount.');return}
  const all=goals();
  const g=all.find(x=>x.id===goalAddId);
  if(g) g.saved=Math.min(g.target,g.saved+amt);
  saveGoals(all);
  closeModal('modal-goal-add');
  render();
}

function deleteGoal(id){
  if(!confirm('Delete this goal?'))return;
  saveGoals(goals().filter(g=>g.id!==id));
  render();
}

function renderTxItem(t){
  const sign=t.type==='income'?'+':t.type==='saving'?'→':'-';
  const cls=t.type==='income'?'g':t.type==='saving'?'b':'r';
  const bg=t.type==='income'?'var(--green-bg)':t.type==='saving'?'var(--blue-bg)':'var(--red-bg)';
  const d=new Date(t.date+'T12:00:00');
  const ds=d.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
  return `<div class="tx-wrap"><div class="tx">
    <div class="tx-icon" style="background:${bg}">${t.icon||'💸'}</div>
    <div class="tx-info">
      <div class="tx-desc">${t.desc}</div>
      <div class="tx-meta">${ds}${t.note?' · '+t.note:''} <span class="badge" style="background:${bg};color:var(--text2)">${t.cat}</span></div>
    </div>
    <div class="tx-amt ${cls}">${sign}${fmt(t.amount)}</div>
    <button class="del-btn" onclick="deleteTx(${t.id})">×</button>
  </div></div>`;
}

function render(){
  const {y,m}=curMonthYear();
  document.getElementById('month-lbl').textContent=new Date(y,m,1).toLocaleString('en-AU',{month:'long',year:'numeric'});

  const all=txs();
  const mTxs=all.filter(t=>{ const d=new Date(t.date+'T12:00:00'); return d.getFullYear()===y&&d.getMonth()===m });
  const mInc=mTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const mExp=mTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const mBal=mInc-mExp;

  // Overview page
  if(curPage==='overview'){
    document.getElementById('ov-inc').textContent=fmt(mInc);
    document.getElementById('ov-exp').textContent=fmt(mExp);
    const balEl=document.getElementById('ov-bal');
    balEl.textContent=(mBal<0?'-':'')+fmt(Math.abs(mBal));
    balEl.style.color=mBal>=0?'var(--green)':'var(--red)';
    const pct=mInc>0?Math.min(100,Math.round(mExp/mInc*100)):0;
    const bar=document.getElementById('ov-bar');
    bar.style.width=pct+'%';
    bar.style.background=pct>90?'var(--red)':pct>70?'var(--yellow)':'var(--green)';
    const recent=[...mTxs].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);
    document.getElementById('ov-txlist').innerHTML=recent.length?recent.map(renderTxItem).join(''):'<div class="empty">No transactions this month yet</div>';
  }

  // Transactions page
  if(curPage==='transactions'){
    const weeks=getMonthWeeks(y,m);
    if(selWeekIdx<0){ const ci=weeks.findIndex(w=>isThisWeek(w.start,w.end)); selWeekIdx=ci>=0?ci:0 }
    const tabsEl=document.getElementById('week-tabs');
    tabsEl.innerHTML=weeks.map((w,i)=>{
      const isc=isThisWeek(w.start,w.end); const isa=i===selWeekIdx;
      const cls='wtab'+(isc?' cur':'')+(isa?' sel':'');
      const fd=d=>d.toLocaleDateString('en-AU',{day:'numeric',month:'short'});
      return `<button class="${cls}" onclick="selWeek(${i})">W${w.num}<span>${fd(w.start)}–${fd(w.end)}</span></button>`;
    }).join('');
    const sw=weeks[selWeekIdx];
    if(sw){
      const sk=dk(sw.start),ek=dk(sw.end);
      const wTxs=all.filter(t=>t.date>=sk&&t.date<=ek).sort((a,b)=>b.date.localeCompare(a.date));
      const wi=wTxs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
      const we=wTxs.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
      const wb=wi-we;
      document.getElementById('wk-inc').textContent=fmt(wi);
      document.getElementById('wk-exp').textContent=fmt(we);
      const bel=document.getElementById('wk-bal');
      bel.textContent=(wb<0?'-':'')+fmt(Math.abs(wb));
      bel.style.color=wb>=0?'var(--green)':'var(--red)';
      document.getElementById('wk-txlist').innerHTML=wTxs.length?wTxs.map(renderTxItem).join(''):'<div class="empty">No transactions this week</div>';
      // Cat breakdown
      const exps=wTxs.filter(t=>t.type==='expense');
      const cats={};
      exps.forEach(t=>{if(!cats[t.cat])cats[t.cat]={amt:0,icon:t.icon||'📦'}; cats[t.cat].amt+=t.amount});
      const sorted=Object.entries(cats).sort((a,b)=>b[1].amt-a[1].amt);
      document.getElementById('wk-cats').innerHTML=sorted.length?`<div class="cat-title-row">Spending Breakdown</div>`+sorted.map(([cat,v])=>{
        const pct=we>0?Math.round(v.amt/we*100):0;
        return `<div class="catrow"><div class="catrow-icon">${v.icon}</div><div class="catrow-name">${cat}</div><div class="catrow-bar"><div class="catrow-fill" style="width:${pct}%"></div></div><div class="catrow-amt">${fmt(v.amt)}</div><div class="catrow-pct">${pct}%</div></div>`;
      }).join(''):'';
    }
  }

  // Analytics page
  if(curPage==='analytics'){
    // 6-month bar chart
    const months=[];
    for(let i=5;i>=0;i--){ const d=new Date(); d.setMonth(d.getMonth()-i); months.push({y:d.getFullYear(),m:d.getMonth(),lbl:d.toLocaleString('en-AU',{month:'short'})}) }
    const mdata=months.map(mo=>{
      const mt=all.filter(t=>{ const d=new Date(t.date+'T12:00:00'); return d.getFullYear()===mo.y&&d.getMonth()===mo.m });
      return {lbl:mo.lbl,inc:mt.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0),exp:mt.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0)};
    });
    const maxVal=Math.max(...mdata.map(d=>Math.max(d.inc,d.exp)),1);
    document.getElementById('bar-chart').innerHTML=mdata.map(d=>{
      const ih=Math.round(d.inc/maxVal*70),eh=Math.round(d.exp/maxVal*70);
      return `<div class="bc-col"><div class="bc-bar-wrap" style="display:flex;align-items:flex-end;gap:2px;height:100%"><div class="bc-bar inc" style="height:${ih}px;flex:1"></div><div class="bc-bar exp" style="height:${eh}px;flex:1"></div></div><div class="bc-lbl">${d.lbl}</div></div>`;
    }).join('');
    // All-time cat breakdown
    const allExp=all.filter(t=>t.type==='expense');
    const totalExp=allExp.reduce((s,t)=>s+t.amount,0);
    const ac={};
    allExp.forEach(t=>{if(!ac[t.cat])ac[t.cat]={amt:0,icon:t.icon||'📦'}; ac[t.cat].amt+=t.amount});
    const acs=Object.entries(ac).sort((a,b)=>b[1].amt-a[1].amt).slice(0,6);
    document.getElementById('an-cats').innerHTML=acs.length?acs.map(([cat,v])=>{
      const pct=totalExp>0?Math.round(v.amt/totalExp*100):0;
      return `<div class="catrow"><div class="catrow-icon">${v.icon}</div><div class="catrow-name">${cat}</div><div class="catrow-bar"><div class="catrow-fill" style="width:${pct}%"></div></div><div class="catrow-amt">${fmt(v.amt)}</div><div class="catrow-pct">${pct}%</div></div>`;
    }).join(''):'<div class="empty">No expense data yet</div>';
  }

  // Goals page
  if(curPage==='goals'){
    const gs=goals();
    document.getElementById('goals-list').innerHTML=gs.length?gs.map(g=>{
      const pct=Math.min(100,Math.round(g.saved/g.target*100));
      const done=pct>=100;
      const rem=Math.max(0,g.target-g.saved);
      return `<div class="goal-card">
        <div class="goal-top"><span class="goal-name">${g.icon} ${g.name}</span><button class="del-btn" onclick="deleteGoal(${g.id})">×</button></div>
        <div class="goal-amts">${fmt(g.saved)} of ${fmt(g.target)}</div>
        <div class="goal-bar"><div class="goal-fill${done?' done':''}" style="width:${pct}%"></div></div>
        <div class="goal-bottom">
          <span class="goal-pct${done?' done':''}">${done?'✓ Complete!':pct+'%'}</span>
          <span class="goal-eta">${done?'Goal reached 🎉':'$'+rem.toFixed(2)+' to go'}</span>
          ${!done?`<button class="goal-add-btn" onclick="openAddToGoal(${g.id})">+ Add</button>`:''}
        </div>
      </div>`;
    }).join(''):'<div class="empty">No goals yet — add one below!</div>';
  }
}

function selWeek(i){ selWeekIdx=i; render() }

// Init
document.getElementById('f-date').value=dk(new Date());
renderQcats();
render();
</script>
</body>
</html>
